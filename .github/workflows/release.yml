name: Release (custom)

# 只在定制 tag 上跑：v<上游版本>-custom.<序号>，例如 v0.1.4657-custom.1。
# 文件名必须是 release.yml：internal/update/attest.go 的 SAN 正则写死了
# /.github/workflows/release.yml@refs/(heads/main|tags/v…)，改名字溯源就匹配不上。
on:
  push:
    tags: ['v*-custom.*']

permissions:
  contents: write      # 建 Release、推 gh-pages
  id-token: write      # attest-build-provenance 要的 OIDC 令牌
  attestations: write  # 写构建溯源

# 两个发布不能同时改 gh-pages
concurrency:
  group: release-custom
  cancel-in-progress: false

jobs:
  release:
    name: build, sign, publish
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out custom
        uses: actions/checkout@v4
        with:
          ref: custom
          fetch-depth: 0   # tag 校验与 git describe 都要全量历史

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod   # 版本跟 go.mod 走，不写死
          cache: true

      # tag 必须打在 custom 的 tip 上，且基础版本必须是历史里那个上游 tag。
      # 打在旧提交上、或从错的上游基线拉出来的 tag，在这里停下，不产出错包。
      - name: Check the tag matches the source
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)-custom\.(\d+)$') {
            throw "tag '$tag' is not v<upstream version>-custom.<n>"
          }
          $base = $Matches[1]
          $here = @(git tag --points-at HEAD)
          if ($here -notcontains $tag) {
            throw "tag '$tag' is not on the tip ($(git rev-parse --short HEAD)); the release would carry other commits. Tags here: $($here -join ', ')"
          }
          $nearest = (git describe --tags --abbrev=0 --exclude '*-custom.*').Trim()
          if ($LASTEXITCODE -ne 0 -or $nearest -eq '') {
            throw 'no upstream tag in history: cannot tell which upstream version this is based on'
          }
          if ($nearest -ne "v$base") {
            throw "tag '$tag' says upstream v$base, but the newest upstream tag in this history is '$nearest'"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "VERSION=$($tag.Substring(1))" -Encoding ascii
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "BASE=$base" -Encoding ascii
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "TAG=$tag" -Encoding ascii
          Write-Host "tag $tag on $(git rev-parse --short HEAD), upstream base v$base"

      # windows-latest 镜像里没有 GNU make（只有 CMake），装一个即可；幂等：
      # 已经有了就只打印版本，不重装。
      - name: Ensure make
        shell: bash
        run: |
          if ! command -v make >/dev/null 2>&1; then
            choco install make -y --no-progress
            export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          fi
          make --version

      - name: Build the Windows app
        shell: bash
        run: make release-windows VERSION="$TAG"

      # 只要 windows 两个架构：默认 TARGETS 还含 darwin/linux/android 七个目标，
      # 这一版不发布它们（DESIGN.md D7），多编只会让流水线更慢更脆。
      - name: Build the CLI
        shell: bash
        run: make release-cli VERSION="$TAG" TARGETS="windows/amd64 windows/arm64"

      # 逐字节可控的清单：显式四个文件名、LF 行尾、<hex> + 两个空格 + 名字。
      # 不能用 sha256sum dist/*：那样会把 SHA256SUMS 自己（空文件的哈希）也写进去。
      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $names = @(
            'magpie-windows-amd64.exe',
            'magpie-windows-arm64.exe',
            'magpie-cli-windows-amd64.exe',
            'magpie-cli-windows-arm64.exe'
          )
          $lines = foreach ($n in $names) {
            $p = Join-Path 'dist' $n
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "missing $p" }
            $h = (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $n"
          }
          $text = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'SHA256SUMS'), $text, (New-Object System.Text.ASCIIEncoding))
          Get-Content -LiteralPath 'SHA256SUMS' | ForEach-Object { Write-Host $_ }

      - name: Write the release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $text = "基于上游 v$env:BASE 的定制版"
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'release-notes.md'), $text, (New-Object System.Text.UTF8Encoding($false)))

      # 私钥只在 RUNNER_TEMP 里存在，签完立刻删；自验失败则该步非零退出，发布中止。
      - name: Sign SHA256SUMS
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.MAGPIE_UPDATE_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) { throw 'MAGPIE_UPDATE_SIGNING_KEY is empty: add the secret first' }
          $key = Join-Path $env:RUNNER_TEMP 'magpie-update-key.pem'
          [System.IO.File]::WriteAllText($key, $env:SIGNING_KEY, (New-Object System.Text.UTF8Encoding($false)))
          $code = 1
          try {
            ./scripts/sign-release.ps1 -Version $env:VERSION -SumsPath . -KeyPath $key
            $code = $LASTEXITCODE
          } finally {
            if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key -Force }
          }
          if ($code -ne 0) { throw "sign-release.ps1 failed with exit code $code" }

      # 上面那步被中断时兜底：任何情况下私钥文件都不留在 runner 上
      - name: Remove the signing key
        if: always()
        shell: pwsh
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'magpie-update-key.pem'
          if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key -Force }
          Write-Host "signing key gone: $(-not (Test-Path -LiteralPath $key))"

      # 溯源：update 会拿签名清单里的 sha256 去问
      # api.github.com/repos/geilige/magpie/attestations/sha256:<digest>，
      # SAN 必须指向本仓库的 .github/workflows/release.yml
      - name: Attest the release files
        # v2 → v2.4.0 的 commit：这个 action 拿到 id-token 与 attestations 写权限，
        # 浮动 tag 被改指向就等于谁都能替我们签溯源，所以钉死 SHA。
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/magpie-windows-amd64.exe
            dist/magpie-windows-arm64.exe
            dist/magpie-cli-windows-amd64.exe
            dist/magpie-cli-windows-arm64.exe
            SHA256SUMS

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 重跑：资产覆盖、说明重写，不新建 release
            gh release upload "$TAG" \
              dist/magpie-windows-amd64.exe dist/magpie-windows-arm64.exe \
              dist/magpie-cli-windows-amd64.exe dist/magpie-cli-windows-arm64.exe \
              SHA256SUMS SHA256SUMS.sig --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              dist/magpie-windows-amd64.exe dist/magpie-windows-arm64.exe \
              dist/magpie-cli-windows-amd64.exe dist/magpie-cli-windows-arm64.exe \
              SHA256SUMS SHA256SUMS.sig \
              --title "magpie $TAG" --notes-file release-notes.md
          fi

      # latest.json 在清单与签名之后生成，assets 里只放四个二进制：
      # 清单/签名/feed 自己都不能进 assets，否则 verify() 拿签名清单核对它们必失败。
      - name: Write latest.json
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = [System.IO.File]::ReadAllText((Join-Path (Get-Location) 'release-notes.md')).Trim()
          ./scripts/make-feed.ps1 -Version $env:VERSION -Repo "${{ github.repository }}" -SumsPath . -DistPath dist -OutPath latest.json -Notes $notes
          if ($LASTEXITCODE -ne 0) { throw "make-feed.ps1 failed with exit code $LASTEXITCODE" }

      # gh-pages 只是单文件的发布分支：已有就接在它后面，没有就从空树起一个。
      # 用 plumbing 直接造 commit，不碰工作区，也不用 force push。
      - name: Publish latest.json to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          parent=""
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            parent=$(git rev-parse FETCH_HEAD)
          fi
          blob=$(git hash-object -w latest.json)
          tree=$(printf '100644 blob %s\tlatest.json\n' "$blob" | git mktree)
          if [ -n "$parent" ]; then
            commit=$(git commit-tree "$tree" -p "$parent" -m "feed: $TAG")
          else
            commit=$(git commit-tree "$tree" -m "feed: $TAG")
          fi
          git push origin "$commit:refs/heads/gh-pages"
          echo "gh-pages now serves latest.json from $commit"
